[project]
name = "portfolio-lab"
version = "0.1.0"
description = "VC-FIN-001 portfolio analysis and rebalancing simulator"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.uv]
package = false
